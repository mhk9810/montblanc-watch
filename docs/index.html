<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>몽블랑 예약 알리미</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1f3b4d">
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1d2a33; --muted: #6b7680;
    --line: #e3ddd0; --brand: #1f3b4d; --open: #1d7a4c; --open-bg: #e3f4ea;
    --wait: #8a6d1f; --wait-bg: #f6efd9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.5;
  }
  header { background: var(--brand); color: #f4f1ea; padding: 28px 16px 22px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; opacity: .8; font-size: 14px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .checked { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px; margin-bottom: 14px;
  }
  .card h2 { margin: 0; font-size: 18px; }
  .sub { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
  .badge {
    display: inline-block; font-weight: 700; font-size: 17px; padding: 8px 14px;
    border-radius: 999px; margin-bottom: 10px;
  }
  .badge.open { background: var(--open-bg); color: var(--open); }
  .badge.wait { background: var(--wait-bg); color: var(--wait); }
  .days { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .days span { font-size: 13px; background: var(--open-bg); color: var(--open); padding: 3px 8px; border-radius: 8px; }
  a.btn {
    display: block; text-align: center; text-decoration: none; font-weight: 700;
    background: var(--brand); color: #fff; padding: 13px; border-radius: 12px; font-size: 16px;
  }
  a.btn.ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }
  .note { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
  ol { padding-left: 20px; margin: 8px 0 12px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>🏔 몽블랑 산장 예약 알리미</h1>
  <p>2027년 6월 예약이 열렸는지 5분마다 확인해요</p>
</header>
<main>
  <p class="checked" id="checked">확인 중…</p>
  <div id="cards"></div>

  <div class="card">
    <h2>🔔 폰으로 알림 받기</h2>
    <ol>
      <li>아래 버튼을 크롬으로 열기</li>
      <li><b>Subscribe / 구독</b> 누르고, 알림 허용</li>
      <li>크롬 메뉴(⋮) → <b>홈 화면에 추가</b> 하면 앱처럼 쓸 수 있어요</li>
    </ol>
    <a class="btn ghost" href="https://ntfy.sh/montblanc-2027-3ecf3d6f" target="_blank">알림 채널 열기</a>
  </div>
</main>
<script>
const REPO = "mhk9810/montblanc-watch";
const INFO = {
  "Nant Borrant": "프랑스 · Les Contamines · 1459m",
  "La Nova": "프랑스 · Les Chapieux",
};

function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "방금";
  if (m < 60) return `${m}분 전`;
  if (m < 60 * 24) return `${Math.round(m / 60)}시간 전`;
  return `${Math.round(m / 1440)}일 전`;
}

function card(name, r) {
  const open = r.status === "open";
  const days = Object.entries(r.days || {})
    .map(([d, s]) => `<span>${+d}일 · ${s}</span>`).join("");
  return `<div class="card">
    <h2>${name}</h2><p class="sub">${INFO[name] || ""}</p>
    <div class="badge ${open ? "open" : "wait"}">${open ? "🟢 6월 예약 열렸어요!" : "⏳ 아직 안 열렸어요"}</div>
    ${open ? `<div class="days">${days}</div>` : ""}
    <a class="btn ${open ? "" : "ghost"}" href="${r.url}" target="_blank">${open ? "지금 예약하러 가기" : "예약 페이지 보기"}</a>
  </div>`;
}

function bonattiCard(b) {
  return `<div class="card">
    <h2>Rifugio Bonatti</h2><p class="sub">이탈리아 · Courmayeur · Val Ferret</p>
    <p class="note">달력 없이 <b>요청서</b>를 보내면 산장에서 메일로 확정해주는 방식이에요. 지금도 신청서는 보낼 수 있어요.
    ${b.changed_at ? `<br>📝 예약 페이지 내용이 바뀌었어요 (${ago(b.changed_at)})` : ""}</p>
    <a class="btn ghost" href="${b.url || "https://www.rifugiobonatti.it/en/book-now/"}" target="_blank">신청서 페이지 보기</a>
  </div>`;
}

async function load() {
  try {
    const s = await (await fetch("status.json?t=" + Date.now())).json();
    document.getElementById("cards").innerHTML =
      Object.entries(s.refuges).map(([n, r]) => card(n, r)).join("") + bonattiCard(s.bonatti || {});
  } catch (e) {
    document.getElementById("cards").innerHTML = `<p class="note">상태를 불러오지 못했어요. 잠시 후 다시 열어주세요.</p>`;
  }
  try {
    const r = await (await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/check.yml/runs?per_page=1&status=success`)).json();
    const t = r.workflow_runs?.[0]?.updated_at;
    document.getElementById("checked").textContent = t ? `마지막 확인: ${ago(t)}` : "";
  } catch (e) {
    document.getElementById("checked").textContent = "";
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
