<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>몽블랑 예약 알리미</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1f3b4d">
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1d2a33; --muted: #6b7680;
    --line: #e3ddd0; --brand: #1f3b4d; --open: #1d7a4c; --open-bg: #e3f4ea;
    --wait: #8a6d1f; --wait-bg: #f6efd9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.5;
  }
  header { background: var(--brand); color: #f4f1ea; padding: 28px 16px 22px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; opacity: .8; font-size: 14px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .refresh { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
  .checked { font-size: 14px; color: var(--muted); margin: 0; }
  #checkNow {
    font: inherit; font-size: 15px; font-weight: 700; color: #fff; background: var(--brand);
    border: 0; border-radius: 999px; padding: 10px 16px; white-space: nowrap; cursor: pointer;
  }
  #checkNow:disabled { opacity: .55; cursor: default; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px; margin-bottom: 14px;
  }
  .card h2 { margin: 0; font-size: 18px; }
  .sub { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
  .badge {
    display: inline-block; font-weight: 700; font-size: 17px; padding: 8px 14px;
    border-radius: 999px; margin-bottom: 10px;
  }
  .badge.open { background: var(--open-bg); color: var(--open); }
  .badge.wait { background: var(--wait-bg); color: var(--wait); }
  .days { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .watch { font-size: 15px; font-weight: 700; padding: 10px 12px; border-radius: 10px; margin: 0 0 12px; }
  .watch.full { background: var(--wait-bg); color: var(--wait); }
  .watch.free { background: var(--open-bg); color: var(--open); }
  .days span { font-size: 13px; background: var(--open-bg); color: var(--open); padding: 3px 8px; border-radius: 8px; }
  a.btn {
    display: block; text-align: center; text-decoration: none; font-weight: 700;
    background: var(--brand); color: #fff; padding: 13px; border-radius: 12px; font-size: 16px;
  }
  a.btn.ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }
  .note { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
  ol { padding-left: 20px; margin: 8px 0 12px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>🏔 몽블랑 산장 예약 알리미</h1>
  <p>2027년 6월 예약이 열렸는지 5분마다 확인해요</p>
</header>
<main>
  <div class="refresh">
    <p class="checked" id="checked">확인 중…</p>
    <button id="checkNow" type="button">🔄 지금 확인하기</button>
  </div>
  <p class="note" id="checkMsg" hidden></p>
  <div id="cards"></div>

  <div class="card">
    <h2>🔔 폰으로 알림 받기</h2>
    <ol>
      <li>아래 버튼을 크롬으로 열기</li>
      <li><b>Subscribe / 구독</b> 누르고, 알림 허용</li>
      <li>크롬 메뉴(⋮) → <b>홈 화면에 추가</b> 하면 앱처럼 쓸 수 있어요</li>
    </ol>
    <a class="btn ghost" href="https://ntfy.sh/montblanc-2027-3ecf3d6f" target="_blank">알림 채널 열기</a>
  </div>
</main>
<script>
const REPO = "mhk9810/montblanc-watch";
const INFO = {
  "Nant Borrant": "프랑스 · Les Contamines · 1459m",
  "La Nova": "프랑스 · Les Chapieux",
  "Rifugio Bonatti": "이탈리아 · Courmayeur · Val Ferret",
};

function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "방금";
  if (m < 60) return `${m}분 전`;
  if (m < 60 * 24) return `${Math.round(m / 60)}시간 전`;
  return `${Math.round(m / 1440)}일 전`;
}

function card(name, r) {
  const open = r.status === "open";
  const days = Object.entries(r.days || {})
    .map(([d, s]) => `<span>${+d}일 · ${s}</span>`).join("");
  return `<div class="card">
    <h2>${name}</h2><p class="sub">${INFO[name] || ""}</p>
    <div class="badge ${open ? "open" : "wait"}">${open ? "🟢 6월 예약 열렸어요!" : "⏳ 아직 안 열렸어요"}</div>
    ${Object.entries(r.watch || {}).map(([d, w]) => {
      const label = `${+d.slice(3, 5)}월 ${+d.slice(0, 2)}일`;
      return w.seats
        ? `<p class="watch free">🛏 ${label}: ${w.seats}자리 났어요! 빨리 예약하세요</p>`
        : `<p class="watch full">🛏 ${label}: 만실 · 자리 나면 바로 알려드려요</p>`;
    }).join("")}
    ${open ? `<div class="days">${days}</div>` : ""}
    <a class="btn ${open ? "" : "ghost"}" href="${r.url}" target="_blank">${open ? "지금 예약하러 가기" : "예약 페이지 보기"}</a>
  </div>`;
}

const LIVE = "https://ntfy.sh/montblanc-2027-3ecf3d6f-status";
const TRIGGER = "https://ntfy.sh/montblanc-2027-3ecf3d6f-check";
let lastChecked = null;

function render(s) {
  document.getElementById("cards").innerHTML =
    Object.entries({...s.refuges, "Rifugio Bonatti": s.bonatti || {}}).map(([n, r]) => card(n, r)).join("");
  if (s.checked_at) lastChecked = s.checked_at;
  document.getElementById("checked").textContent = lastChecked ? `마지막 확인: ${ago(lastChecked)}` : "";
}

// ntfy 상태 채널에서 since 이후의 가장 최신 결과
async function liveStatus(since) {
  const text = await (await fetch(`${LIVE}/json?poll=1&since=${since}`)).text();
  const msgs = text.trim().split("\n").filter(Boolean).map(l => JSON.parse(l)).filter(e => e.event === "message");
  return msgs.length ? JSON.parse(msgs[msgs.length - 1].message) : null;
}

async function load() {
  try {
    const s = await liveStatus("latest");
    if (s) return render(s);
  } catch (e) {}
  try {
    render(await (await fetch("status.json?t=" + Date.now())).json());
  } catch (e) {
    document.getElementById("cards").innerHTML = `<p class="note">상태를 불러오지 못했어요. 잠시 후 다시 열어주세요.</p>`;
  }
}

async function checkNow() {
  const btn = document.getElementById("checkNow");
  const msg = document.getElementById("checkMsg");
  btn.disabled = true;
  btn.textContent = "확인 중…";
  msg.hidden = true;
  const since = Math.floor(Date.now() / 1000);
  try {
    await fetch(TRIGGER, { method: "POST", body: "check" });
    for (let i = 0; i < 36; i++) {          // 최대 3분 기다림
      await new Promise(r => setTimeout(r, 5000));
      const s = await liveStatus(since);
      if (s) { render(s); msg.hidden = true; return; }
      if (i === 6) { msg.textContent = "확인 서버가 잠깐 쉬는 중이에요. 몇 분 안에 확인돼요…"; msg.hidden = false; }
    }
    msg.textContent = "아직 응답이 없어요. 조금 뒤에 다시 눌러주세요.";
    msg.hidden = false;
  } catch (e) {
    msg.textContent = "요청을 보내지 못했어요. 인터넷 연결을 확인해주세요.";
    msg.hidden = false;
  } finally {
    btn.disabled = false;
    btn.textContent = "🔄 지금 확인하기";
  }
}

document.getElementById("checkNow").addEventListener("click", checkNow);
load();
setInterval(load, 60000);
</script>
</body>
</html>
